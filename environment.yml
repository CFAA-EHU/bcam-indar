# To use:
#
#   $ mamba env create -f environment.yml  # `conda` works too for this command
#   $ mamba activate indar-dev
#
name: indar-dev
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.13
  - attrs
  - pytest
  - numpy
  - scipy
  - scikit-learn
  - pandas
  - matplotlib
  - sympy
  - sphinx
  - numpydoc
  - pip>=23.1
  - pip:
    - hatch
    - hatch-requirements-txt
    - jitcode
    - symengine
    - pip-tools
    - sphinx-nefertiti
